<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account · CategoryRAG</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="brand">CategoryRAG</div>
  </header>

  <main class="auth-page">
    <section class="panel auth-card">
      <h1>Create account</h1>
      <p class="panel-subtitle">Sign up with Auth0. We’ll create your CategoryRAG profile on first login.</p>

      <a class="btn btn-primary btn-block auth-cta" href="{{ url_for('auth.register') }}">Create account with Auth0</a>

      <p class="auth-footer">
        Already have an account?
        <a href="{{ url_for('dashboard.login_page') }}">Sign in</a>
      </p>
    </section>
  </main>
</body>
</html>
