<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account · CategoryRAG</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="brand">CategoryRAG</div>
  </header>

  <main class="auth-page">
    <section class="panel auth-card">
      <h1>Create account</h1>
      <p class="panel-subtitle">Start organizing documents by category.</p>

      <div id="message" class="message hidden"></div>

      <form id="register-form" class="auth-form" method="post" action="#">
        <label class="field">
          <span>Email</span>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label class="field">
          <span>Confirm password</span>
          <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" minlength="8" required>
        </label>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <p class="auth-footer">
        Already have an account?
        <a href="{{ url_for('dashboard.login_page') }}">Sign in</a>
      </p>
    </section>
  </main>
</body>
</html>
