<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · CategoryRAG</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="brand">CategoryRAG</div>
  </header>

  <main class="auth-page">
    <section class="panel auth-card">
      <h1>Sign in</h1>
      <p class="panel-subtitle">Continue with Auth0 to access your categories.</p>

      <a class="btn btn-primary btn-block auth-cta" href="{{ url_for('auth.login') }}">Sign in with Auth0</a>

      <p class="auth-footer">
        No account yet?
        <a href="{{ url_for('auth.register') }}">Create one</a>
      </p>
    </section>
  </main>
</body>
</html>
