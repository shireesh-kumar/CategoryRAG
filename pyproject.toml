[project]
name = "categoryrag"
version = "0.1.0"
description = "Category-scoped RAG with Flask admin API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask[async]>=3.1.3",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "qdrant-client>=1.9.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "boto3>=1.34.0",
    "psycopg[binary]>=3.1.0",
    "mcp>=2.0.0",
    "auth0-server-python>=1.0.0b1,<2",
    "markupsafe>=3.0.3",
    "pyjwt[crypto]>=2.13.0",
    "requests>=2.34.2",
    "authlib>=1.8.0",
    "cryptography>=50.0.0",
]

[project.scripts]
categoryrag = "categoryrag.app:main"
categoryrag-mcp = "categoryrag.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["categoryrag"]
